
[package]
name = "makekeeper"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
reqwest = { version = "0.12", features = ["blocking"] }
colored = "2"
libc = "0.2"
