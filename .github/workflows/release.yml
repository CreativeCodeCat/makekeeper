name: Build and Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-arch:
    runs-on: ubuntu-latest
    container: archlinux/archlinux:latest

    steps:
    # git must be installed before checkout so the workspace is a real repository for makepkg to clone
    - name: Install build dependencies
      run: pacman -Syu --needed --noconfirm base-devel git cmake qt6-base libgit2 curl nlohmann-json polkit

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create .pkg.tar.zst
      run: |
        # Build the checked-out commit instead of the PKGBUILD's upstream source
        sed -i "s|git+https://github.com/CreativeCodeCat/makekeeper.git|git+file://${GITHUB_WORKSPACE}#commit=${GITHUB_SHA}|" PKGBUILD
        useradd -m builder
        chown -R builder:builder "${GITHUB_WORKSPACE}"
        su builder -c "cd '${GITHUB_WORKSPACE}' && makepkg --clean --force --nocheck"
        mkdir -p releases
        cp makekeeper-*.pkg.tar.zst releases/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: arch-package
        path: releases/*.pkg.tar.zst

  build-ubuntu:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake pkg-config qt6-base-dev libgit2-dev libcurl4-openssl-dev nlohmann-json3-dev

    - name: Build release
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --parallel

    - name: Create .deb
      run: |
        VERSION=$(grep -oP 'project\(makekeeper VERSION \K[0-9.]+' CMakeLists.txt)
        mkdir -p releases/deb/DEBIAN
        make install DESTDIR="$PWD/releases/deb"
        strip releases/deb/usr/local/bin/makekeeper releases/deb/usr/local/lib/makekeeper/makekeeper-helper

        # Work out shared library dependencies from the built binary
        mkdir -p debian && touch debian/control
        SHLIBS=$(dpkg-shlibdeps -O releases/deb/usr/local/bin/makekeeper | sed 's/^shlibs:Depends=//')
        rm -rf debian

        cat > releases/deb/DEBIAN/control <<EOF
        Package: makekeeper
        Version: ${VERSION}
        Section: utils
        Priority: optional
        Architecture: amd64
        Depends: ${SHLIBS}, git, make, pkexec | policykit-1
        Maintainer: makekeeper contributors
        Homepage: https://github.com/CreativeCodeCat/makekeeper
        Description: A safer installer for Makefile-based Linux applications
         MakeKeeper installs, tracks, updates and uninstalls applications that use
         GNU Make build systems, from the command line or a Qt GUI.
        EOF
        dpkg-deb --root-owner-group -b releases/deb "releases/makekeeper_${VERSION}_amd64.deb"
        rm -rf releases/deb

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ubuntu-package
        path: releases/*.deb

  build-appimage:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake pkg-config qt6-base-dev qt6-base-dev-tools libgit2-dev libcurl4-openssl-dev nlohmann-json3-dev

    - name: Build release
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --parallel

    - name: Create .AppImage
      env:
        # Runners have no FUSE, so let the linuxdeploy AppImages extract themselves
        APPIMAGE_EXTRACT_AND_RUN: 1
        QMAKE: /usr/lib/qt6/bin/qmake
      run: |
        VERSION=$(grep -oP 'project\(makekeeper VERSION \K[0-9.]+' CMakeLists.txt)
        make install DESTDIR="$PWD/AppDir" PREFIX=/usr FISHDIR=/usr/share/fish/vendor_completions.d

        # Pinned releases; update the tag and checksum together when upgrading
        wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
        wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
        sha256sum -c - <<EOF
        c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy-x86_64.AppImage
        15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724  linuxdeploy-plugin-qt-x86_64.AppImage
        EOF
        chmod +x linuxdeploy-*.AppImage

        export LINUXDEPLOY_OUTPUT_VERSION="$VERSION"
        ./linuxdeploy-x86_64.AppImage --appdir AppDir \
          --desktop-file makekeeper.desktop \
          --icon-file makekeeper.svg \
          --plugin qt \
          --output appimage

        mkdir -p releases
        mv MakeKeeper-*.AppImage releases/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: appimage-package
        path: releases/*.AppImage

  build-fedora:
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
    - name: Install build dependencies
      # libstdc++-static: makekeeper-helper links the C++ runtime statically
      run: dnf install -y cmake gcc-c++ libstdc++-static make git pkgconf-pkg-config qt6-qtbase-devel libgit2-devel libcurl-devel json-devel rpm-build

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build release
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --parallel

    - name: Create .rpm
      run: |
        VERSION=$(grep -oP 'project\(makekeeper VERSION \K[0-9.]+' CMakeLists.txt)
        make install DESTDIR="$GITHUB_WORKSPACE/releases/staging"
        cat > releases/makekeeper.spec <<EOF
        Name: makekeeper
        Version: ${VERSION}
        Release: 1
        Summary: A safer installer for Makefile-based Linux applications
        License: GPL-3.0
        URL: https://github.com/CreativeCodeCat/makekeeper
        Requires: git make polkit

        %define debug_package %{nil}

        %description
        MakeKeeper installs, tracks, updates and uninstalls applications that use
        GNU Make build systems, from the command line or a Qt GUI.

        %install
        cp -a %{staging}/. %{buildroot}/

        %files
        /usr/local/bin/makekeeper
        /usr/local/lib/makekeeper/makekeeper-helper
        /usr/share/polkit-1/actions/io.github.creativecodecat.makekeeper.policy
        /usr/local/share/man/man1/makekeeper.1
        /usr/local/share/applications/makekeeper.desktop
        /usr/local/share/icons/hicolor/128x128/apps/makekeeper-128.png
        /usr/local/share/icons/hicolor/scalable/apps/makekeeper.svg
        /usr/share/fish/vendor_completions.d/makekeeper.fish
        EOF
        rpmbuild -bb releases/makekeeper.spec \
          --define "staging $GITHUB_WORKSPACE/releases/staging" \
          --define "_rpmdir $GITHUB_WORKSPACE/releases"
        rm -rf releases/staging releases/makekeeper.spec

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: fedora-package
        path: releases/**/*.rpm

  release:
    needs: [build-arch, build-ubuntu, build-appimage, build-fedora]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Collect the packages in dist/, not releases/: the checkout contains old packages
    # committed in releases/, which would otherwise be uploaded with every release
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist

    - name: Move packages to dist folder
      run: |
        find dist -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.pkg.tar.zst" -o -name "*.AppImage" \) -exec mv {} dist/ \;
        find dist -type d -empty -delete
        ls -l dist

    - name: Upload packages to GitHub release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
          gh release upload "$GITHUB_REF_NAME" dist/*.deb dist/*.rpm dist/*.pkg.tar.zst dist/*.AppImage --clobber
        else
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.rpm dist/*.pkg.tar.zst dist/*.AppImage \
            --title "$GITHUB_REF_NAME" --generate-notes
        fi
