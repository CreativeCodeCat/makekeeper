name: Build and Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-arch:
    runs-on: ubuntu-latest
    container: archlinux/archlinux:latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Rust
      run: pacman -Sy --noconfirm rust base-devel binutils
    
    - name: Build release
      run: cargo build --release
    
    - name: Create releases directory
      run: mkdir -p releases
    
    - name: Create .pkg.tar.zst
      run: |
        pacman -Sy --needed --noconfirm base-devel rust cargo git
        useradd -m builder
        chown -R builder:builder "${GITHUB_WORKSPACE}"
        su builder -c "cd '${GITHUB_WORKSPACE}' && makepkg --clean --force"
        mkdir -p releases
        cp makekeeper-0.1.0-1-x86_64.pkg.tar.zst releases/
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: arch-package
        path: releases/*.pkg.tar.zst

  build-ubuntu:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true
    
    - name: Build release
      run: cargo build --release
    
    - name: Create releases directory
      run: mkdir -p releases
    
    - name: Create .deb
      run: |
        mkdir -p releases/deb/DEBIAN
        mkdir -p releases/deb/usr/local/bin
        mkdir -p releases/deb/usr/local/share/man/man1
        install -m 755 target/release/makekeeper releases/deb/usr/local/bin/makekeeper
        install -m 644 makekeeper.1 releases/deb/usr/local/share/man/man1/makekeeper.1
        cat > releases/deb/DEBIAN/control <<EOF
        Package: makekeeper
        Version: 0.1.0
        Section: utils
        Priority: optional
        Architecture: amd64
        Maintainer: makekeeper contributors
        Description: A safer installer for Makefile-based Linux applications
         makekeeper provides a controlled way to install applications that use GNU Make build systems.
        EOF
        dpkg-deb -b releases/deb releases/makekeeper_0.1.0_amd64.deb
        rm -rf releases/deb
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ubuntu-package
        path: releases/*.deb

  build-fedora:
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust and RPM tools
      run: dnf install -y rust cargo rpm-build

    - name: Build release
      run: cargo build --release

    - name: Create releases directory
      run: mkdir -p releases

    - name: Create .spec file
      run: |
        export SOURCE_DATE_EPOCH=$(date +%s)
        mkdir -p $HOME/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
        mkdir -p $HOME/rpmbuild/BUILDROOT/makekeeper-0.1.0-x86_64/usr/local/bin
        mkdir -p $HOME/rpmbuild/BUILDROOT/makekeeper-0.1.0-x86_64/usr/local/share/man/man1
        install -m 755 target/release/makekeeper $HOME/rpmbuild/BUILDROOT/makekeeper-0.1.0-x86_64/usr/local/bin/makekeeper
        install -m 644 makekeeper.1 $HOME/rpmbuild/BUILDROOT/makekeeper-0.1.0-x86_64/usr/local/share/man/man1/makekeeper.1

        cat > $HOME/rpmbuild/SPECS/makekeeper.spec <<EOF
        Name: makekeeper
        Version: 0.1.0
        Release: 1%{?dist}
        Summary: A safer installer for Makefile-based Linux applications
        License: GPL-3.0
        BuildArch: x86_64
        AutoReqProv: no

        %description
        makekeeper provides a controlled way to install applications that use GNU Make build systems.

        %install
        # Files are already in buildroot

        %files
        /usr/local/bin/makekeeper
        /usr/local/share/man/man1/makekeeper.1
        EOF

        rpmbuild -bb $HOME/rpmbuild/SPECS/makekeeper.spec \
            --buildroot $HOME/rpmbuild/BUILDROOT/makekeeper-0.1.0-x86_64 \
            --define "_topdir $HOME/rpmbuild"

        cp $HOME/rpmbuild/RPMS/x86_64/*.rpm releases/
        rm -rf $HOME/rpmbuild

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: fedora-package
        path: releases/**/*.rpm
        
  release:
    needs: [build-arch, build-ubuntu, build-fedora]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: releases
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          releases/**/*.deb
          releases/**/*.rpm
          releases/**/*.pkg.tar.zst
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
