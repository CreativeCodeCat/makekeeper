<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#252b36" />
      <stop offset="100%" stop-color="#12151b" />
    </linearGradient>

    <!-- Metallic Box Outer Gradient -->
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d4659" />
      <stop offset="50%" stop-color="#2b3240" />
      <stop offset="100%" stop-color="#1e232d" />
    </linearGradient>

    <!-- Top Lid Face Gradient -->
    <linearGradient id="topFaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4f5b73" />
      <stop offset="100%" stop-color="#384356" />
    </linearGradient>

    <!-- Rust Orange Core Accent -->
    <linearGradient id="rustAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b39" />
      <stop offset="100%" stop-color="#e04800" />
    </linearGradient>

    <!-- Glowing Cyan Accent -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Icon Container (Rounded App Tile) -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" stroke="#384356" stroke-width="4" filter="url(#dropShadow)" />

  <!-- Subtle Outer Rim Light -->
  <rect x="34" y="34" width="444" height="444" rx="94" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />

  <!-- Isometric Package Shield Base Group -->
  <g transform="translate(0, -10)">

    <!-- Package Bottom / Back Shadow Plate -->
    <path d="M 256 112 L 390 188 L 390 330 L 256 406 L 122 330 L 122 188 Z" fill="url(#boxGrad)" stroke="#1a202c" stroke-width="6" filter="url(#dropShadow)" />

    <!-- Left Facet -->
    <path d="M 122 188 L 256 264 L 256 406 L 122 330 Z" fill="#232936" stroke="#181d26" stroke-width="2" />

    <!-- Right Facet -->
    <path d="M 256 264 L 390 188 L 390 330 L 256 406 Z" fill="#1b202a" stroke="#181d26" stroke-width="2" />

    <!-- Top Isometric Lid -->
    <path d="M 256 112 L 390 188 L 256 264 L 122 188 Z" fill="url(#topFaceGrad)" stroke="#5d6c88" stroke-width="2" />

    <!-- Circuit Trace Pattern on Top Lid -->
    <path d="M 180 222 L 210 205 L 235 218" fill="none" stroke="url(#cyanGlow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
    <circle cx="180" cy="222" r="4" fill="#00f2fe" />
    <circle cx="235" cy="218" r="4" fill="#00f2fe" />

    <path d="M 332 222 L 302 205 L 277 218" fill="none" stroke="url(#cyanGlow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
    <circle cx="332" cy="222" r="4" fill="#00f2fe" />
    <circle cx="277" cy="218" r="4" fill="#00f2fe" />

    <!-- Center Rust-Lang / Keeper Shield Badge -->
    <g transform="translate(256, 310)">
      <!-- Outer Shield Body -->
      <path d="M 0 -55 L 45 -30 L 45 20 C 45 50 0 70 0 70 C 0 70 -45 50 -45 20 L -45 -30 Z" fill="url(#rustAccent)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="3" filter="url(#dropShadow)" />

      <!-- Inner Shield Inset -->
      <path d="M 0 -45 L 36 -24 L 36 16 C 36 40 0 56 0 56 C 0 56 -36 40 -36 16 L -36 -24 Z" fill="#181d26" opacity="0.85" />

      <!-- Lock Keyhole Emblem (MakeKeeper "Keeper") -->
      <circle cx="0" cy="-6" r="10" fill="url(#rustAccent)" />
      <path d="M -6 -4 L 6 -4 L 9 18 L -9 18 Z" fill="url(#rustAccent)" />
      <circle cx="0" cy="-6" r="4" fill="#181d26" />
    </g>

    <!-- Top Central Beam / Sync Ring Highlight -->
    <ellipse cx="256" cy="188" rx="28" ry="16" fill="none" stroke="url(#cyanGlow)" stroke-width="4" filter="url(#glow)" opacity="0.9" />
  </g>

  <!-- Glowing Status Indicator Bar at Bottom (Active Daemon) -->
  <rect x="196" y="420" width="120" height="8" rx="4" fill="#10141d" />
  <rect x="200" y="422" width="112" height="4" rx="2" fill="url(#cyanGlow)" filter="url(#glow)" />
</svg>